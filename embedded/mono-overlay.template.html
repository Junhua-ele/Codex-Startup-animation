/* AI entry: wake, circuit routing, real readiness indicators and handoff. */

.ready-ring{position:absolute;inset:-25%;width:150%;height:150%;transform:rotate(-90deg);pointer-events:none}.ready-ring circle{fill:none;stroke:#fff;stroke-width:.6;stroke-dasharray:1;stroke-dashoffset:1;opacity:0}.handoff-flash{position:absolute;inset:-70%;border-radius:50%;opacity:0;pointer-events:none;background:radial-gradient(circle,#ffffff4d,transparent 58%)}

@keyframes core-wake{0%{opacity:0;transform:scale(.1)}25%{opacity:1;transform:scale(1)}65%{opacity:1}100%{opacity:0;transform:scale(5)}}@keyframes wake-scan{0%{opacity:0;transform:scaleX(0)}35%{opacity:1;transform:scaleX(.9)}100%{opacity:0;transform:scaleX(1)}}@keyframes frame-wake{to{opacity:1}}@keyframes circuit-ping{0%,14%{opacity:0}35%{opacity:.8}65%{opacity:.4}100%{opacity:0}}@keyframes volume-wake{to{opacity:1}}@keyframes trail-memory{0%{opacity:0}10%{opacity:.3}55%{opacity:.12}100%{opacity:0}}
